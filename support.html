<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EveryCam — Support</title>
<style>
  :root {
    --background-primary: #F4E9D8;
    --surface-panel: #EDDCC0;
    --border-subtle: #D8C3A0;
    --text-primary: #241B12;
    --text-secondary: #6B5B47;
    --action-tag: #C99B5B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--background-primary);
    color: var(--text-primary);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0;
    font-weight: 700;
  }
  .meta {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  .lang-switch {
    display: inline-flex;
    flex-wrap: wrap;
    background: var(--surface-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    align-self: flex-start;
  }
  .lang-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-switch button.active {
    background: var(--background-primary);
    color: var(--text-primary);
  }
  .contact-card {
    background: var(--surface-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 20px 18px;
    margin: 20px 0 32px;
    font-size: 0.98rem;
    color: var(--text-primary);
    line-height: 1.6;
  }
  .contact-card .label {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-bottom: 4px;
  }
  .contact-card a.mail {
    display: inline-block;
    margin-top: 4px;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none;
    border-bottom: 1px solid var(--action-tag);
  }
  section {
    margin-bottom: 28px;
  }
  section h2 {
    font-size: 1.1rem;
    margin: 0 0 10px;
    font-weight: 700;
  }
  section p, section li {
    line-height: 1.65;
    font-size: 0.98rem;
    color: var(--text-primary);
  }
  section ul {
    padding-left: 1.2em;
  }
  a { color: var(--text-primary); }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  footer a { color: var(--text-secondary); }
  [data-lang-content] { display: none; }
  [data-lang-content].active { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="de" class="active">DE</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="nl">NL</button>
      <button type="button" data-lang="pl">PL</button>
    </div>
    <div>
      <h1 data-i18n="title"></h1>
      <div class="meta" data-i18n="meta"></div>
    </div>
  </header>

  <div class="contact-card">
    <div class="label" data-i18n="contactLabel"></div>
    <a class="mail" href="mailto:torquesoul@icloud.com">torquesoul@icloud.com</a>
  </div>

  <main id="content"></main>

  <footer data-i18n="footer"></footer>
</div>

let currentLang = "de";

function render() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerHTML = meta[key][currentLang];
  });

  const content = document.getElementById("content");
  content.innerHTML = "";
  sections.forEach(section => {
    const el = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = section.heading[currentLang];
    el.appendChild(h2);
    section.body.forEach(block => {
      if (Array.isArray(block)) {
        const ul = document.createElement("ul");
        block.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item[currentLang];
          ul.appendChild(li);
        });
        el.appendChild(ul);
      } else {
        const p = document.createElement("p");
        p.textContent = block[currentLang];
        el.appendChild(p);
      }
    });
    content.appendChild(el);
  });
}

document.querySelectorAll(".lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-switch button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});

render();
</script>
