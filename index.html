    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    align-self: flex-start;
  }
  .lang-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;

    border-radius: 12px;
    padding: 16px 18px;
    margin: 20px 0 32px;
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  }
  section {

  }
  section h2 {
    font-size: 1.1rem;
    margin: 0 0 10px;
    font-weight: 700;
  }
  section p, section li {

    font-size: 0.98rem;
    color: var(--text-primary);
  }
  section ul {
    padding-left: 1.2em;
  }
  a { color: var(--text-primary); }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  [data-lang-content] { display: none; }
  [data-lang-content].active { display: block; }

let currentLang = "de";

function render() {
  document.documentElement.lang = currentLang;
  // meta und provider sind zwei getrennte Wörterbücher, teilen sich aber
  // dasselbe data-i18n-Attribut — ein einzelnes querySelectorAll("[data-i18n]")
  // muss daher in beiden nachschlagen, sonst wirft der Zugriff auf ein in
  // meta fehlendes Provider-Feld (z. B. "owner") eine Exception und bricht
  // render() vor den Sections/dem Footer ab (Bugfix, 2026-07-30).
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    const dict = meta[key] ?? provider[key];
    el.textContent = dict[currentLang];
  });

  const content = document.getElementById("content");
  content.innerHTML = "";
  sections.forEach(section => {
    const el = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = section.heading[currentLang];
    el.appendChild(h2);
    section.body.forEach(block => {
      if (Array.isArray(block)) {
        const ul = document.createElement("ul");
        block.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item[currentLang];
          ul.appendChild(li);
        });
        el.appendChild(ul);
      } else {
        const p = document.createElement("p");
        p.textContent = block[currentLang];
        el.appendChild(p);
      }
    });
    content.appendChild(el);
  });
}

document.querySelectorAll(".lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-switch button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});

render();
</script>
