<style>
  :root {
    --background-primary: #F4E9D8;
    --surface-panel: #EDDCC0;
    --border-subtle: #D8C3A0;
    --text-primary: #241B12;
    --text-secondary: #6B5B47;
    --action-tag: #C99B5B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--background-primary);
    color: var(--text-primary);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0;
    font-weight: 700;
  }
  .meta {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  .lang-switch {
    display: inline-flex;
    flex-wrap: wrap;
    background: var(--surface-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    align-self: flex-start;
  }
  .lang-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-switch button.active {
    background: var(--background-primary);
    color: var(--text-primary);
  }
  .provider-card {
    background: var(--surface-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 16px 18px;
    margin: 20px 0 32px;
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .provider-card strong {
    color: var(--text-primary);
  }
  section {
    margin-bottom: 28px;
  }
  section h2 {
    font-size: 1.1rem;
    margin: 0 0 10px;
    font-weight: 700;
  }
  section p, section li {
    line-height: 1.65;
    font-size: 0.98rem;
    color: var(--text-primary);
  }
  section ul {
    padding-left: 1.2em;
  }
  a { color: var(--text-primary); }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  [data-lang-content] { display: none; }
  [data-lang-content].active { display: block; }
</style>
</head>

let currentLang = "de";

function render() {
  document.documentElement.lang = currentLang;
  // meta und provider sind zwei getrennte Wörterbücher, teilen sich aber
  // dasselbe data-i18n-Attribut — ein einzelnes querySelectorAll("[data-i18n]")
  // muss daher in beiden nachschlagen, sonst wirft der Zugriff auf ein in
  // meta fehlendes Provider-Feld (z. B. "owner") eine Exception und bricht
  // render() vor den Sections/dem Footer ab (Bugfix, 2026-07-30).
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    const dict = meta[key] ?? provider[key];
    el.textContent = dict[currentLang];
  });

  const content = document.getElementById("content");
  content.innerHTML = "";
  sections.forEach(section => {
    const el = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = section.heading[currentLang];
    el.appendChild(h2);
    section.body.forEach(block => {
      if (Array.isArray(block)) {
        const ul = document.createElement("ul");
        block.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item[currentLang];
          ul.appendChild(li);
        });
        el.appendChild(ul);
      } else {
        const p = document.createElement("p");
        p.textContent = block[currentLang];
        el.appendChild(p);
      }
    });
    content.appendChild(el);
  });
}

document.querySelectorAll(".lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-switch button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});

render();
